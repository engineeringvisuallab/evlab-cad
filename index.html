<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVLab CAD</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<header id="menubar">
  <div class="brand"><b>EVLab CAD</b><span>Engineering • Innovation • Learning</span></div>
  <nav>
    <div class="menu"><button>Edit</button><div class="drop">
      <button data-act="undo">Undo (Ctrl+Z)</button><button data-act="redo">Redo (Ctrl+Y)</button>
      <button data-act="delete">Delete selected (Del)</button>
      <button data-act="select-all">Select all</button>
      <button data-act="deselect">Deselect (Esc)</button>
    </div></div>
    <div class="menu"><button>View</button><div class="drop">
      <button data-act="zoom-in">Zoom in</button>
      <button data-act="zoom-out">Zoom out</button>
      <button data-act="extents">Zoom extents</button>
      <button data-act="reset">Reset view</button>
      <button data-act="grid">Toggle grid (F7)</button>
    </div></div>
    <div class="menu"><button>Draw</button><div class="drop">
      <button data-tool="line">Line</button><button data-tool="polyline">Polyline</button>
      <button data-tool="rect">Rectangle</button><button data-tool="circle">Circle</button><button data-tool="arc">Arc</button>
    </div></div>
    <div class="menu"><button>Modify</button><div class="drop">
      <button data-tool="move">Move</button><button data-tool="copy">Copy</button><button data-tool="rotate">Rotate</button><button data-tool="scale">Scale</button><button data-tool="mirror">Mirror</button>
      <button data-tool="offset">Offset</button><button data-tool="trim">Trim</button><button data-tool="extend">Extend</button><button data-tool="fillet">Fillet</button><button data-tool="chamfer">Chamfer</button>
      <button data-cmd="EXPLODE">Explode</button><button data-cmd="JOIN">Join</button><button data-cmd="AREA">Area of selection</button>
    </div></div>
    <div class="menu"><button>Annotate</button><div class="drop">
      <button data-tool="dimlinear">Linear dimension</button><button data-tool="dimaligned">Aligned dimension</button><button data-tool="dimradius">Radius dimension</button><button data-tool="dimdiameter">Diameter dimension</button>
    </div></div>
    <div class="menu"><button>Settings</button><div class="drop">
      <button data-act="units-mm">Units: millimetres</button>
      <button data-act="units-m">Units: metres</button>
    </div></div>
    <span class="later" title="Arrives in a later milestone">File · Insert · Layers · Tools · Help — not yet built</span>
  </nav>
</header>
<div id="toolbar">
  <button data-act="undo">Undo</button><button data-act="redo">Redo</button><span class="sep"></span>
  <button data-tool="select">Select</button><button data-tool="dist">Distance</button>
  <button data-tool="line">Line</button><button data-tool="polyline">Polyline</button>
  <button data-tool="rect">Rectangle</button><button data-tool="circle">Circle</button><button data-tool="arc">Arc</button>
  <button data-act="delete">Delete</button>
  <span class="sep"></span>
  <button data-act="pan" id="btn-pan" title="Pan (middle mouse or Space)">Pan</button>
  <button data-act="zoom-in">Zoom +</button><button data-act="zoom-out">Zoom −</button>
  <button data-act="extents">Extents</button><button data-act="grid" id="btn-grid">Grid</button>
</div>
<main>
  <aside id="layers"><h3>Layers</h3><div id="layers-body"></div></aside>
  <div id="stage"><canvas id="cad" tabindex="0" aria-label="Drawing canvas"></canvas></div>
  <aside id="props"><h3>Properties</h3><div id="props-body"></div></aside>
</main>
<div id="cmd"><div id="cmdlog"></div><input id="cmdin" autocomplete="off" spellcheck="false" placeholder="Command (LINE, CIRCLE, LAYER, HELP…) or point: 100,200 · @50,0 · @100<45"></div>
<footer id="status">
  <span id="coords">X 0.000  Y 0.000</span>
  <span id="zoom"></span><span id="units">mm</span>
  <button data-act="osnap" id="b-osnap">OSNAP F3</button><button data-act="gsnap" id="b-gsnap">SNAP F9</button><button data-act="ortho" id="b-ortho">ORTHO F8</button><span id="prompt"></span>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
